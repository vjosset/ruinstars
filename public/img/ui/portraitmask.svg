<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100">
  <defs>
    <filter id="erode">
      <feTurbulence type="turbulence" baseFrequency="0.1" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="roughen-edges">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="150" height="100" fill="white" filter="url(#roughen-edges)"/>
</svg>
